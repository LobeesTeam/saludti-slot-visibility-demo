<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Slot Visibility Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: blue app band, white role tabs, one content column. Blue = private / payment required, green = insured / covered, amber = held. Single light theme on purpose, matching the clinic app. */
:root{
  --blue:#3b82f6;--blue-d:#1d4ed8;--blue-l:#e8f0fe;--bg:#f3f6fb;--surface:#fff;--ink:#111827;--muted:#5b6678;--line:#dbe3ef;
  --green:#15803d;--green-l:#dcfce7;--amber:#c2710c;--amber-l:#fef3c7;--red:#dc2626;--red-l:#fee2e2;
  --font:'Roboto','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);margin:0;font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{background:var(--blue);color:#fff}
.bandin{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:center;padding-block:16px}
.brand{display:flex;gap:14px;align-items:center}
.logo{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.brand b{font-size:22px;font-weight:700;display:block;line-height:1.2}.brand small{opacity:.85;font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:14px}
.clock{display:flex;align-items:center;gap:8px}
.clock b{min-width:100px;text-align:center;font-weight:500}
.clock button,.lang button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:8px;width:30px;height:30px;font-size:16px}
.lang{display:flex;gap:4px}.lang button{width:auto;padding:0 10px;font-size:13px;font-weight:500}
.lang button.on{background:#fff;color:var(--blue-d)}
.wrap{max-width:1120px;margin:0 auto;padding-block:18px 56px}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance}
h2{font-size:22px;font-weight:700}h3{font-size:17px;font-weight:700}
h2 .ic,h3 .ic{color:var(--blue)}
p{margin:0}.muted{color:var(--muted)}.small{font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:18px}
.tabs .lbl{color:var(--muted);font-size:13px}
.seg{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--blue);border-radius:8px;overflow:hidden;background:#fff}
button{font:inherit;color:inherit;cursor:pointer}
.seg button{border:0;background:#fff;color:var(--blue-d);padding:8px 16px;font-weight:500}
.seg button+button{border-left:1px solid var(--blue)}
.seg button.on{background:var(--blue);color:#fff}
.sub{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.sub button{border:1px solid var(--line);background:#fff;color:var(--muted);padding:7px 14px;border-radius:99px;font-weight:500}
.sub button.on{background:var(--blue-l);border-color:var(--blue);color:var(--blue-d)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 45%,transparent);outline-offset:1px}
.btn{border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:8px;font-weight:500}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.bad{color:var(--red)}.btn.sm{padding:4px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{font-size:12px;background:var(--blue-l);padding:3px 9px;border-radius:99px;color:var(--blue-d);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(17,24,39,.05)}
.card>h2+p,.card>h3+p{margin-top:4px}
.grid{display:grid;gap:14px;margin-top:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:14px 18px;margin-top:14px;align-items:flex-end}
label{font-size:13px;color:var(--ink);font-weight:500;display:block}
select,input[type=number],input[type=text],input[type=password]{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-top:4px;max-width:100%}
input[type=number]{width:78px}
select:focus,input:focus{border-color:var(--blue)}
.scroll{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
thead th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600}
tbody th{font-weight:500;white-space:nowrap}
.cal td{text-align:center}
.none{color:var(--muted);font-size:13px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-top:12px}
.slot{font-size:13px;font-weight:500;padding:9px 0;border-radius:10px;border:2px solid var(--line);background:#fff;text-align:center;line-height:1.2}
.slot small{display:block;font-size:10px;font-weight:400;color:var(--muted);margin-top:2px}
.slot.open{border-color:var(--blue)}
.slot.held{border-color:var(--amber);background:repeating-linear-gradient(135deg,var(--amber-l) 0 4px,#fff 4px 8px)}
.slot.bp{background:var(--blue);color:#fff;border-color:var(--blue)}.slot.bp small{color:#e8f0fe}
.slot.bi{background:var(--green);color:#fff;border-color:var(--green)}.slot.bi small{color:#dcfce7}
.slot.sel,.scard.sel{outline:3px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;margin-top:12px;align-items:center}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 10px;border-radius:99px;background:#eef2f7;color:var(--muted)}
.pill.ok{background:var(--green-l);color:var(--green)}.pill.warn{background:var(--amber-l);color:var(--amber)}.pill.bad{background:var(--red-l);color:var(--red)}
.pill.blue{background:var(--blue-l);color:var(--blue-d)}
.count{background:var(--blue);color:#fff;font-size:13px;font-weight:500;padding:6px 14px;border-radius:99px}
.kpi{background:var(--blue-l);border-radius:10px;padding:14px 16px}
.kpi b{display:block;font-size:26px;font-weight:700;margin-top:2px;color:var(--blue-d)}.kpi span{font-size:13px;color:var(--muted)}
.note{background:var(--blue-l);border-radius:9px;padding:10px 14px;font-size:14px;margin-top:12px}
.note.warn{background:var(--amber-l)}.note.good{background:var(--green-l)}.note.bad{background:var(--red-l)}
.mx td{text-align:center;padding:0}
.mx button{display:block;width:100%;border:0;padding:9px 6px;background:none;font-size:13px;font-weight:500;line-height:1.25}
.mx button small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.dcwrap{display:flex;align-items:flex-start;gap:8px;margin-top:14px}
.dcols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:12px;flex:1;min-width:0;overflow:auto;max-height:460px;padding:2px}
.dcol h4{font-size:14px;font-weight:700;text-align:center;position:sticky;top:0;background:#fff;padding:4px 0;margin-bottom:6px;z-index:1}
.scard{display:block;width:100%;text-align:center;padding:8px 6px;margin-bottom:8px;border-radius:12px;border:2px solid var(--line);background:#fff;line-height:1.25}
.scard b{display:block;font-size:17px;font-weight:500}.scard span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase}.scard small{font-size:12px;color:var(--muted)}
.scard.cov{border-color:var(--green)}.scard.pay{border-color:var(--blue)}.scard.open{border-color:var(--blue)}
.scard.held{border-color:var(--amber);background:repeating-linear-gradient(135deg,var(--amber-l) 0 4px,#fff 4px 8px)}
.arrow{flex:none;align-self:center;width:40px;height:40px;border-radius:50%;border:0;background:#bcd3fb;color:#fff;font-size:22px}
.fig{margin:14px 0 0;overflow-x:auto}.fig svg{display:block;min-width:700px;width:100%;height:auto}
figcaption{font-size:13px;color:var(--muted);margin-top:8px;max-width:78ch}
svg text{fill:currentColor;font-family:var(--font)}
svg .t{font-weight:700;font-size:13px}svg .ts{font-size:11px;fill:var(--muted)}svg .lb{font-size:11px;fill:var(--muted)}
svg .nd{fill:#fff;stroke:var(--line);stroke-width:1.5}svg .nd.ac{stroke:var(--blue);stroke-width:2;fill:var(--blue-l)}
svg .ar{fill:none;stroke:var(--muted);stroke-width:1.5}svg .ah{fill:var(--muted)}
svg .sq-bp{fill:var(--blue)}svg .sq-bi{fill:var(--green)}
svg .sq-open{fill:#fff;stroke:var(--blue);stroke-width:1.5}
svg .sq-held{fill:url(#hatch);stroke:var(--amber);stroke-width:1.5}
svg .sq-hid{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:3 3;opacity:.7}
svg .chartline{fill:none;stroke:var(--blue);stroke-width:2.5}
svg .grid-l{stroke:var(--line);stroke-width:1}
svg .handle{fill:#fff;stroke:var(--blue);stroke-width:3;cursor:ns-resize;touch-action:none}
.chartbox svg{display:block;width:100%;height:auto;max-width:560px;touch-action:none}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.ptable input{width:64px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:16px}
.step{background:var(--blue-l);border-radius:12px;padding:16px}
.step i{font-style:normal;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;margin-bottom:8px}
.step h3{margin-bottom:4px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:14px}
.roles>div{border:1px solid var(--line);border-radius:10px;padding:14px}
.roles h3{font-size:16px;margin-bottom:4px}
.demo-tag{display:inline-block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:2px 7px;margin-right:4px}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg)}
.gcard{width:100%;max-width:420px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(17,24,39,.12)}
.ghead{background:var(--blue);color:#fff;padding:20px 22px;display:flex;gap:14px;align-items:center}
.gbody{padding:22px}.gbody input{width:100%}.gbody .btn{width:100%;margin-top:14px;padding:11px}
.glang{display:flex;justify-content:flex-end;margin-bottom:12px}
.glang .lang button{background:#fff;color:var(--blue-d);border:1px solid var(--blue)}.glang .lang button.on{background:var(--blue);color:#fff}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#f0b24a" stroke-width="3"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker>
</defs></svg>

<div id="app"></div>

<script>
(function(){
'use strict';
/* ---------- language + helpers ---------- */
const S={lang:'es',unlocked:false};
const x=(en,es)=>S.lang==='es'?es:en;
const LOC=()=>S.lang==='es'?'es-ES':'en-GB';
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const BASE=new Date(2026,10,3);
const fmt=n=>{const d=new Date(BASE);d.setDate(d.getDate()+n);return d};
const dl=n=>cap(fmt(n).toLocaleDateString(LOC(),{weekday:'short',day:'numeric',month:'short'}));
const dlong=n=>cap(fmt(n).toLocaleDateString(LOC(),{weekday:'long',day:'numeric',month:'long'}));
const isWork=n=>{const w=fmt(n).getDay();return w>0&&w<6};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const eur=n=>Math.round(n).toLocaleString(LOC())+' €';
const cyrb=(str)=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)};
const GATE=5026005183694811;
const bi=o=>Array.isArray(o)?x(o[0],o[1]):o;

/* ---------- demo data ---------- */
const TIMES=['09:00','09:15','09:30','09:45','10:00','10:15','10:30','10:45','16:00','16:15','16:30','16:45','17:00','17:15'];
const W=[.2,.2,.25,.25,.45,.45,.55,.55,.8,.85,.9,.9,.85,.8]; // private demand weight: mornings are the valley, late afternoons are premium
const PF=70,IF=35,DUR='15 min';
const DOCS=[
 {id:'d1',n:'Elena Pérez',f:1,spec:'Cardiology',agr:['Percentage, high on private','Porcentaje, alto sobre privado'],noshow:.08,privShare:.5},
 {id:'d2',n:'Marcos Gómez',f:0,spec:'Cardiology',agr:['Percentage, high on private','Porcentaje, alto sobre privado'],noshow:.06,privShare:.45},
 {id:'d3',n:'Lucía Romero',f:1,spec:'Dermatology',agr:['Fixed rent','Alquiler fijo'],noshow:.1,privShare:.4}];
const dn=d=>(S.lang==='es'&&d.f?'Dra. ':'Dr. ')+d.n;
const SPEC={Cardiology:['Cardiology','Cardiología'],Dermatology:['Dermatology','Dermatología']};
const sn=k=>bi(SPEC[k]);
const INS=[
 {id:'adeslas',name:'Adeslas',weekly:10,maxWait:10,ref:'AD-2231',prov:false},
 {id:'dkv',name:'DKV',weekly:5,maxWait:7,ref:'DKV-0917',prov:false},
 {id:'sanitas',name:'Sanitas',weekly:0,maxWait:14,ref:'',prov:true}];
const insName=id=>id==='private'?x('Private','Privado'):INS.find(i=>i.id===id).name;
const SIM={};
DOCS.forEach(d=>{SIM[d.id]={};for(let n=0;n<45;n++){if(!isWork(n))continue;const r=mul(hash(d.id+n));
 SIM[d.id][n]=TIMES.map((t,i)=>{const w=W[i];if(r()>.5+.4*w)return null;
  const priv=r()<Math.min(.85,d.privShare*(.5+w));const u=Math.max(r(),1e-6),q=r();
  let L=priv?Math.min(18,Math.floor(-Math.log(u)*4)):Math.min(40,3+Math.floor(-Math.log(u)*9));
  return{payer:priv?'private':(q<.5?'adeslas':q<.8?'dkv':'sanitas'),bookedDay:n-L}})}});

const STD={first:[{d:0,p:0},{d:1,p:5},{d:3,p:15},{d:7,p:35},{d:14,p:60}],rev:[{d:0,p:0},{d:1,p:0},{d:3,p:5},{d:7,p:15},{d:14,p:30}]};
const PRESETS={
 short:{label:['Short curve (protection only up to 3 days)','Curva corta (protección solo hasta 3 días)'],first:[{d:0,p:0},{d:1,p:5},{d:3,p:15},{d:4,p:0},{d:14,p:0}],rev:[{d:0,p:0},{d:1,p:0},{d:3,p:5},{d:4,p:0},{d:14,p:0}]},
 zero:{label:['Zero protection','Protección cero'],first:[{d:0,p:0},{d:14,p:0}],rev:[{d:0,p:0},{d:14,p:0}]},
 total:{label:['Total protection until 2 days before','Protección total hasta 2 días antes'],first:[{d:0,p:0},{d:1,p:0},{d:2,p:100},{d:14,p:100}],rev:[{d:0,p:0},{d:1,p:0},{d:2,p:100},{d:14,p:100}]}};
const pl=k=>bi(PRESETS[k].label);
const REASONS=[['Recurring patient','Paciente recurrente'],['Urgency','Urgencia'],['Doctor request','Petición del médico'],['Other','Otro']];
const rsn=v=>{const r=REASONS.find(a=>a[0]===v);return r?bi(r):v};

Object.assign(S,{role:'how',today:0,horizon:30,
 clinic:{v:1,curves:clone(STD)},
 exc:{d2:{v:1,kind:'zero',curves:{first:clone(PRESETS.zero.first),rev:clone(PRESETS.zero.rev)},by:['Dr. Gómez (opt-out, approved by manager)','Dr. Gómez (exclusión voluntaria, aprobada por el gerente)'],at:-12},
      d3:{v:1,kind:'short',curves:{first:clone(PRESETS.short.first),rev:clone(PRESETS.short.rev)},by:['Fixed-rent agreement rule','Regla del acuerdo de alquiler fijo'],at:-30}},
 ov:[{id:1,doc:'d1',day:8,type:'block',reason:['Private cardiology check-up campaign','Campaña privada de chequeos de cardiología'],author:['Manager','Gerente'],at:-2}],
 req:[{id:1,doc:'d1',kind:'total',status:'pending',at:0}],
 ub:{},ev:[],
 log:[{at:-30,who:['Manager','Gerente'],text:['Clinic default curve v1 activated.','Curva predeterminada v1 de la clínica activada.']},{at:-12,who:['Manager','Gerente'],text:['Approved opt-out for Dr. Marcos Gómez: zero protection.','Aprobada la exclusión del Dr. Marcos Gómez: protección cero.']}],
 pat:{payer:'adeslas',act:'first',spec:'Cardiology',off:0,sel:null,msg:null},heldMode:'hide',
 mg:{tab:'overview',scope:'clinic',draft:null},
 aud:{doc:'d1',day:2,act:'first'},ovForm:{doc:'d1',day:3,type:'open',reason:''},
 dv:{doc:'d1',day:null,act:'first'},
 rc:{filter:'all',off:0,sel:null,payer:'adeslas',reason:'Recurring patient',act:'first',msg:null},gateErr:false});
const logAdd=(en,es)=>S.log.unshift({at:S.today,who:['Manager','Gerente'],text:[en,es]});

/* ---------- protection engine ---------- */
function interp(p,D){const a=[...p].sort((u,v)=>u.d-v.d);if(D<=a[0].d)return a[0].p;const L=a[a.length-1];if(D>=L.d)return L.p;
 for(let i=1;i<a.length;i++)if(D<=a[i].d){const u=a[i-1],v=a[i];return u.p+(v.p-u.p)*(D-u.d)/(v.d-u.d)}return L.p}
const kindName=k=>({zero:x('zero protection','protección cero'),short:x('short curve','curva corta'),total:x('total protection','protección total'),custom:x('custom curve','curva personalizada')}[k]||k);
function curveSrc(docId,act){const e=S.exc[docId];
 if(e)return{pts:e.curves[act],label:x('Doctor exception v','Excepción del médico v')+e.v+' ('+kindName(e.kind)+')',ex:true};
 return{pts:S.clinic.curves[act],label:x('Clinic default v','Predeterminada de la clínica v')+S.clinic.v,ex:false}}
function stat(dId,day,i){const ub=S.ub[dId+'|'+day+'|'+i];if(ub)return{payer:ub.payer,forced:ub.forced,user:true};
 const s=SIM[dId][day]&&SIM[dId][day][i];return s&&s.bookedDay<=S.today?{payer:s.payer}:null}
function computeDay(doc,day,act,ptsIn){
 const D=day-S.today,src=curveSrc(doc.id,act),pts=ptsIn||src.pts;
 const slots=TIMES.map((t,i)=>({i,time:t,w:W[i],st:stat(doc.id,day,i),vis:{},rel:{}}));
 const free=slots.filter(s=>!s.st),pb=slots.filter(s=>s.st&&s.st.payer==='private').length;
 const pct=D>S.horizon?0:interp(pts,D),exp=pct/100*14;
 let prot=Math.min(free.length,Math.round(Math.max(0,exp*(1-doc.noshow)-pb)));
 const ov=S.ov.find(o=>o.doc===doc.id&&o.day===day);
 let why;
 if(ov&&ov.type==='open'){prot=0;why=()=>x('Manual: opened to insurers by ','Manual: abierto a aseguradoras por ')+bi(ov.author)+'. '+x('Reason: ','Motivo: ')+bi(ov.reason)+'.'}
 else if(ov&&ov.type==='block'){prot=free.length;why=()=>x('Manual: held for private by ','Manual: reservado para privado por ')+bi(ov.author)+'. '+x('Reason: ','Motivo: ')+bi(ov.reason)+'.'}
 else if(D>S.horizon)why=()=>x('Beyond the '+S.horizon+'-day protection horizon, so nothing is held.','Más allá del horizonte de protección de '+S.horizon+' días, no se protege nada.');

 h+='<section class="card"><h3>'+x('Doctor requests','Solicitudes de los médicos')+'</h3>'+(S.req.length?'<div class="scroll"><table><thead><tr><th>'+x('Doctor','Médico')+'</th><th>'+x('Request','Solicitud')+'</th><th>'+x('Estimated cost','Coste estimado')+'</th><th>'+x('Status','Estado')+'</th><th></th></tr></thead><tbody>'+S.req.map(q=>{const c=estCost(q.doc,q.kind);return '<tr><td>'+esc(dn(DOCS.find(d=>d.id===q.doc)))+'</td><td>'+pl(q.kind)+'</td><td>'+eur(c.v)+' '+c.t+', '+x('next 20 days','próximos 20 días')+'</td><td><span class="pill '+(q.status==='pending'?'warn':q.status==='approved'?'ok':'')+'">'+stateLabel(q.status)+'</span></td><td>'+(q.status==='pending'?'<button class="btn sm pri" data-a="reqOk" data-id="'+q.id+'">'+x('Approve','Aprobar')+'</button> <button class="btn sm" data-a="reqNo" data-id="'+q.id+'">'+x('Decline','Rechazar')+'</button>':'')+'</td></tr>'}).join('')+'</tbody></table></div>':'<p class="muted">'+x('No requests.','Sin solicitudes.')+'</p>')+'</section>';
 h+='<section class="card"><h3>'+x('Who follows which rule','Quién sigue qué regla')+'</h3><div class="scroll"><table><thead><tr><th>'+x('Doctor','Médico')+'</th><th>'+x('Agreement','Acuerdo')+'</th><th>'+x('Rule in force','Regla vigente')+'</th></tr></thead><tbody>'+DOCS.map(d=>'<tr><td>'+esc(dn(d))+'</td><td>'+bi(d.agr)+'</td><td>'+esc(curveSrc(d.id,'first').label)+'</td></tr>').join('')+'</tbody></table></div></section>';return h}
A.goAudit=d=>{S.aud={doc:d.doc,day:+d.day,act:'first'};S.mg.tab='audit'};
A.reqOk=d=>{const q=S.req.find(z=>String(z.id)===d.id);q.status='approved';const p=PRESETS[q.kind],dc=DOCS.find(z=>z.id===q.doc);S.exc[q.doc]={v:1,kind:q.kind,curves:{first:clone(p.first),rev:clone(p.rev)},by:[dc.n+' (opt-out, approved by manager)',dc.n+' (exclusión voluntaria, aprobada por el gerente)'],at:S.today};
 logAdd('Approved request for '+dc.n+': '+p.label[0]+'.','Aprobada la solicitud de '+dc.n+': '+p.label[1]+'.');S.mg.draft=null};
A.reqNo=d=>{S.req.find(z=>String(z.id)===d.id).status='declined'};

function vManager(){const t=S.mg.tab,tabs=[['overview',x('Overview','Resumen')],['curves',x('Curves','Curvas')],['floors',x('Payer floors','Mínimos por aseguradora')],['levers',x('Levers','Palancas')],['audit',x('Audit and log','Auditoría y registro')]];
 return '<div class="sub">'+tabs.map(q=>'<button class="'+(t===q[0]?'on':'')+'" data-a="mgTab" data-t="'+q[0]+'">'+q[1]+'</button>').join('')+'</div>'+({overview:vOverview,curves:vCurves,floors:vFloors,levers:vLevers,audit:vAudit}[t])()}
A.mgTab=d=>{S.mg.tab=d.t};

function vDoctor(){const v=S.dv,doc=DOCS.find(d=>d.id===v.doc),days=workdays(10);if(!days.includes(v.day))v.day=days[0];
 const src=curveSrc(doc.id,v.act),r=computeDay(doc,v.day,v.act);let held=0;days.slice(0,7).forEach(d=>held+=computeDay(doc,d,'first').prot);
 const mine=S.req.filter(q=>q.doc===doc.id);
 let h='<section class="card"><h2>'+x('My availability rules','Mis reglas de disponibilidad')+'</h2><p class="muted">'+x('Read-only. This shows what affects your agenda and why.','Solo lectura. Muestra qué afecta a tu agenda y por qué.')+'</p><div class="row"><label>'+x('Signed in as','Sesión de')+'<br>'+sel('dv-doc',DOCS.map(d=>[d.id,dn(d)]),v.doc,'dvDoc')+'</label><label>'+x('Visit','Visita')+'<br>'+sel('dv-act',ACTS(),v.act,'dvAct')+'</label></div>'
 +'<div class="grid g4"><div class="kpi"><span>'+x('Agreement','Acuerdo')+'</span><b style="font-size:18px">'+bi(doc.agr)+'</b></div><div class="kpi"><span>'+x('Rule in force','Regla vigente')+'</span><b style="font-size:18px">'+esc(src.label)+'</b></div><div class="kpi"><span>'+x('Held for private, next 7 working days','Protegidos para privado, próximos 7 días laborables')+'</span><b>'+held+'</b></div><div class="kpi"><span>'+x('Expected extra private revenue from holds','Facturación privada extra esperada por las protecciones')+'</span><b>'+eur(held*.5*(PF-IF))+'</b></div></div></section>';
 h+='<section class="card"><h3>'+x('My next working days','Mis próximos días laborables')+'</h3><div class="sub" style="margin-top:12px">'+days.map(d=>{const q=computeDay(doc,d,v.act);return '<button class="'+(v.day===d?'on':'')+'" data-a="dvDay" data-day="'+d+'">'+dl(d)+' · '+q.free+' '+x('free','libres')+' · '+q.prot+' '+x('held','prot.')+'</button>'}).join('')+'</div>'
 +'<div class="slots">'+r.slots.map(slotCell).join('')+'</div>'+legendSlots()
 +'<div class="note"><b>'+x('Why:','Por qué:')+'</b> '+esc(r.why())+'</div></section>';
 h+='<section class="card"><h3>'+x('Ask the clinic manager for a change','Pide un cambio al gerente de la clínica')+'</h3><p class="muted">'+x('The manager approves. You see what each option is expected to cost before you ask.','El gerente aprueba. Ves lo que se espera que cueste cada opción antes de pedirla.')+'</p><div class="grid g2">'+['zero','total'].map(k=>{const c=estCost(doc.id,k);return '<div class="kpi"><span>'+pl(k)+'</span><b>'+eur(c.v)+'</b><span>'+c.t+', '+x('next 20 working days (estimate)','próximos 20 días laborables (estimación)')+'</span><div style="margin-top:10px"><button class="btn sm pri" data-a="dvReq" data-k="'+k+'">'+x('Send request','Enviar solicitud')+'</button></div></div>'}).join('')+'</div>'
 +(mine.length?'<div class="scroll"><table><tbody>'+mine.map(q=>'<tr><td>'+pl(q.kind)+'</td><td>'+dl(q.at)+'</td><td><span class="pill '+(q.status==='pending'?'warn':q.status==='approved'?'ok':'')+'">'+stateLabel(q.status)+'</span></td></tr>').join('')+'</tbody></table></div>':'')+'</section>';return h}
A.dvDoc=(d,t,v)=>{S.dv.doc=v};A.dvAct=(d,t,v)=>{S.dv.act=v};A.dvDay=d=>{S.dv.day=+d.day};
A.dvReq=d=>{S.req.push({id:Date.now(),doc:S.dv.doc,kind:d.k,status:'pending',at:S.today})};

function vReception(){const c=S.rc,docs=c.filter==='all'?DOCS:[DOCS.find(d=>d.id===c.filter)];
 const grid=dayCols({docs,act:c.act,view:'rec',off:c.off,sel:c.sel,pg:'rcPg',a:'rcCard'});
 let h='<section class="card"><h2>'+x('Reception desk','Mostrador de recepción')+'</h2><p class="muted">'+x('Reception sees every free slot. Held slots are marked and can be booked for an insurer only with a reason.','Recepción ve todos los huecos libres. Los protegidos están marcados y solo se pueden reservar para una aseguradora con un motivo.')+'</p><div class="row">'
 +'<label>'+x('Doctor','Médico')+'<br>'+sel('rc-doc',[['all',x('All doctors','Todos los médicos')],...DOCS.map(d=>[d.id,dn(d)])],c.filter,'rcDoc')+'</label><label>'+x('Visit','Visita')+'<br>'+sel('rc-act',ACTS(),c.act,'rcAct')+'</label></div>'
 +'<div class="legend"><span>'+dot('#fff;border:2px solid var(--blue)')+x('Open','Libre')+'</span><span>'+dot('var(--amber)')+x('Held for private','Protegido para privado')+'</span><span class="count">'+grid.n+' '+x('times found','horarios encontrados')+'</span></div>'
 +(c.msg?'<div class="note good">'+esc(c.msg)+'</div>':'')+grid.h;
 if(c.sel){const [di,dy,i]=c.sel.split('|'),doc=DOCS.find(q=>q.id===di),sl=computeDay(doc,+dy,c.act).slots[+i];
  if(!sl.st){const held=!!sl.prot;
   h+='<div class="note'+(held?' warn':'')+'">'+x('Book','Reservar')+' <b>'+TIMES[+i]+'</b> · '+esc(dn(doc))+', '+dlong(+dy)+(held?'. '+x('This slot is <b>held for private patients</b>, so a reason is required for an insurer booking.','Este horario está <b>protegido para pacientes privados</b>, así que una reserva de aseguradora requiere un motivo.'):'.')+'<div class="row">'
   +'<label>'+x('Patient pays','Paga el paciente')+'<br>'+sel('rc-payer',[['private',x('Private','Privado')],...INS.map(q=>[q.id,q.name])],c.payer,'rcPayer')+'</label>'
   +(held&&c.payer!=='private'?'<label>'+x('Reason','Motivo')+'<br>'+sel('rc-reason',REASONS.map(q=>[q[0],bi(q)]),c.reason,'rcReason')+'</label>':'')
   +'<button class="btn pri" data-a="rcBook">'+(held&&c.payer!=='private'?x('Force booking','Forzar reserva'):x('Book','Reservar'))+'</button></div></div>'}}
 h+='</section>';
 h+='<section class="card"><h3>'+x('Recent bookings','Reservas recientes')+'</h3>'+(S.ev.length?'<div class="scroll"><table><thead><tr><th>'+x('Slot','Hueco')+'</th><th>'+x('Payer','Pagador')+'</th><th>'+x('Channel','Canal')+'</th></tr></thead><tbody>'+S.ev.slice(0,6).map(e=>'<tr><td>'+esc(dn(DOCS.find(d=>d.id===e.doc)))+' · '+dl(e.day)+' '+e.time+'</td><td>'+insName(e.payer)+'</td><td>'+e.channel+(e.forced?' <span class="pill warn">'+x('forced: ','forzada: ')+esc(rsn(e.reason))+'</span>':'')+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted">'+x('Nothing booked yet in this demo.','Aún no hay reservas en esta demo.')+'</p>')+'</section>';return h}
A.rcDoc=(d,t,v)=>{S.rc.filter=v;S.rc.sel=null};A.rcAct=(d,t,v)=>{S.rc.act=v;S.rc.sel=null};A.rcPg=d=>{S.rc.off=Math.max(0,Math.min(18,S.rc.off+3*+d.d))};
A.rcCard=d=>{S.rc.sel=d.key;S.rc.msg=null};A.rcPayer=(d,t,v)=>{S.rc.payer=v};A.rcReason=(d,t,v)=>{S.rc.reason=v};
A.rcBook=()=>{const c=S.rc,[di,dy,i]=c.sel.split('|'),doc=DOCS.find(q=>q.id===di),day=+dy,sl=computeDay(doc,day,c.act).slots[+i];if(sl.st){c.sel=null;return}
 const forced=!!sl.prot&&c.payer!=='private';book(doc.id,day,+i,c.payer,{channel:x('Reception','Recepción'),forced,reason:forced?c.reason:''});
 c.msg=x('Booked ','Reservado ')+TIMES[+i]+' · '+dn(doc)+', '+dl(day)+' · '+insName(c.payer)+(forced?x(' (forced, reason: ',' (forzada, motivo: ')+rsn(c.reason)+')':'')+'.';c.sel=null};

/* ---------- shell ---------- */
A.role=d=>{S.role=d.r};
A.lang=d=>{S.lang=d.l};
A.day=d=>{const s=+d.d;let n=S.today+s;while(n>=0&&n<=20&&!isWork(n))n+=s;if(n>=0&&n<=20){S.today=n;S.pat.sel=null;S.rc.sel=null;S.dv.day=null;S.mg.draft=null}};
const logoSVG='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M9 16l2 2 4-4"/></svg>';
const langBtns=()=>'<div class="lang"><button class="'+(S.lang==='es'?'on':'')+'" data-a="lang" data-l="es" aria-label="Español">ES</button><button class="'+(S.lang==='en'?'on':'')+'" data-a="lang" data-l="en" aria-label="English">EN</button></div>';
function renderGate(){document.getElementById('app').innerHTML='<div class="gate"><div style="width:100%;max-width:420px"><div class="glang">'+langBtns()+'</div><form class="gcard" id="gateform" autocomplete="off"><div class="ghead"><span class="logo">'+logoSVG+'</span><div><b style="font-size:20px;display:block">Slot Visibility</b><small style="opacity:.9">'+x('Demo with illustrative data','Demo con datos ilustrativos')+'</small></div></div><div class="gbody"><label for="gate-pw">'+x('Access code','Código de acceso')+'</label><input type="password" id="gate-pw" autofocus>'
 +(S.gateErr?'<div class="note bad">'+x('Incorrect code. Try again.','Código incorrecto. Inténtalo de nuevo.')+'</div>':'')+'<button class="btn pri" type="submit">'+x('Enter','Entrar')+'</button></div></form></div></div>'}
function render(){
 if(!S.unlocked)return renderGate();
 const roles=[['patient',x('Patient','Paciente')],['manager',x('Manager','Gerente')],['doctor',x('Doctor','Médico')],['reception',x('Reception','Recepción')]];
 const view={how:vHow,patient:vPatient,manager:vManager,doctor:vDoctor,reception:vReception}[S.role]();
 document.getElementById('app').innerHTML='<header class="band gut"><div class="bandin"><div class="brand"><span class="logo">'+logoSVG+'</span><div><b>Slot Visibility</b><small>'+x('Dynamic availability by payer · demo with illustrative data','Disponibilidad dinámica por pagador · demo con datos ilustrativos')+'</small></div></div>'
 +'<div class="tools">'+langBtns()+'<div class="clock" title="'+x('Move the demo date to see protection release as the day gets closer','Mueve la fecha de la demo para ver cómo se libera la protección al acercarse el día')+'">'+x('Demo date','Fecha demo')+' <button data-a="day" data-d="-1" aria-label="'+x('Previous working day','Día laborable anterior')+'">‹</button><b>'+dl(S.today)+'</b><button data-a="day" data-d="1" aria-label="'+x('Next working day','Día laborable siguiente')+'">›</button></div></div></div></header>'
 +'<main class="wrap gut"><nav class="tabs"><div class="seg"><button class="'+(S.role==='how'?'on':'')+'" data-a="role" data-r="how">'+x('How it works','Cómo funciona')+'</button></div><span class="lbl">'+x('View as','Ver como')+'</span><div class="seg">'+roles.map(r=>'<button class="'+(S.role===r[0]?'on':'')+'" data-a="role" data-r="'+r[0]+'">'+r[1]+'</button>').join('')+'</div></nav>'+view+'</main>'}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=A[t.dataset.a];if(f){f(t.dataset,t);render()}});
document.addEventListener('change',e=>{const t=e.target.closest('[data-c]');if(!t)return;const f=A[t.dataset.c];if(f){f(t.dataset,t,t.value);render()}});
document.addEventListener('input',e=>{if(e.target.id==='lv-reason'){S.ovForm.reason=e.target.value;const b=document.querySelector('[data-a="lvApply"]');if(b)b.disabled=!e.target.value.trim()}});
document.addEventListener('submit',e=>{if(e.target.id!=='gateform')return;e.preventDefault();
 if(cyrb(document.getElementById('gate-pw').value.trim())===GATE){S.unlocked=true;S.gateErr=false;try{sessionStorage.setItem('svd-ok','1')}catch(_){}}else S.gateErr=true;render()});
try{if(sessionStorage.getItem('svd-ok')==='1')S.unlocked=true}catch(_){}
render();
})();
</script>

</body>
</html>
