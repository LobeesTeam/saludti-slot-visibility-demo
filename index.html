<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Slot Visibility Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: top bar, role switcher, one content column. Teal = private, indigo = insurer, amber = held slots. */
:root{
  --bg:#f3f6f5;--surface:#fff;--surface2:#eaf0ee;--ink:#13242a;--muted:#587076;--line:#d6dfdd;
  --priv:#0e6b66;--ins:#3454d1;--prot:#b97a05;--ok:#1d7a46;--bad:#b3372f;
  --on-priv:#fff;--on-ins:#fff;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e191c;--surface:#15252a;--surface2:#1c3036;--ink:#e3eeee;--muted:#93a9ad;--line:#2a4147;
  --priv:#3fb8ae;--ins:#8199f7;--prot:#e0a63a;--ok:#4cc27f;--bad:#ef7b72;--on-priv:#08181a;--on-ins:#0a1030;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e191c;--surface:#15252a;--surface2:#1c3036;--ink:#e3eeee;--muted:#93a9ad;--line:#2a4147;
  --priv:#3fb8ae;--ins:#8199f7;--prot:#e0a63a;--ok:#4cc27f;--bad:#ef7b72;--on-priv:#08181a;--on-ins:#0a1030;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance}
h2{font-size:22px}h3{font-size:17px}
p{margin:0}.muted{color:var(--muted)}.small{font-size:13px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:center;margin-bottom:16px}
.brand{display:flex;gap:12px;align-items:center}
.mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--priv) 50%,var(--ins) 50%)}
.brand b{font:700 20px var(--display);display:block}.brand small{color:var(--muted);font-size:13px}
.clock{display:flex;align-items:center;gap:8px;font-size:14px}
.clock b{font-family:var(--mono);font-weight:500;min-width:96px;text-align:center}
.tabs{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.tabs .lbl{color:var(--muted);font-size:13px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface2);padding:4px;border-radius:10px}
button{font:inherit;color:inherit;cursor:pointer}
.seg button,.sub button{border:0;background:none;padding:7px 14px;border-radius:7px;font-weight:500}
.seg button.on,.sub button.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.18);color:var(--ink)}
.seg button:not(.on),.sub button:not(.on){color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ins);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;font-weight:500}
.btn.pri{background:var(--priv);color:var(--on-priv);border-color:var(--priv)}
.btn.bad{color:var(--bad)}.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.clock button{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:30px;height:30px}
.chip{font:500 12px var(--mono);background:var(--surface2);padding:3px 8px;border-radius:99px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.card>h2+p,.card>h3+p{margin-top:4px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card .grid{margin-top:14px}
.row{display:flex;flex-wrap:wrap;gap:14px 18px;margin-top:14px;align-items:flex-end}
label{font-size:13px;color:var(--muted);display:block}
select,input[type=number],input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-top:3px;max-width:100%}
input[type=number]{width:78px}
.scroll{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
thead th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600}
tbody th{font-weight:500;white-space:nowrap}
td.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.cal td{text-align:center}.cal th:first-child{text-align:left}
.cellb{border:1px solid var(--priv);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:7px;font:500 13px var(--mono)}
.cellb.on{background:var(--priv);color:var(--on-priv)}
.none{color:var(--muted);font-size:13px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;margin-top:12px}
.slot{font:500 13px var(--mono);padding:10px 0;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);text-align:center;line-height:1.2}
.slot small{display:block;font-size:10px;font-weight:400;opacity:.85;margin-top:2px}
.slot.open{border-color:var(--priv)}
.slot.held{border-color:var(--prot);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--prot) 30%,transparent) 0 4px,transparent 4px 8px)}
.slot.bp{background:var(--priv);color:var(--on-priv);border-color:var(--priv);cursor:default}
.slot.bi{background:var(--ins);color:var(--on-ins);border-color:var(--ins);cursor:default}
.slot.sel{outline:3px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-3px;margin-right:5px;border:1.5px solid var(--line)}
.legend .o{border-color:var(--priv)}.legend .h{border-color:var(--prot);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--prot) 35%,transparent) 0 3px,transparent 3px 6px)}
.legend .bp{background:var(--priv);border-color:var(--priv)}.legend .bi{background:var(--ins);border-color:var(--ins)}
.legend .x{border:1.5px dashed var(--muted);opacity:.7}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--prot) 18%,transparent);color:var(--prot)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.priv{background:color-mix(in srgb,var(--priv) 16%,transparent);color:var(--priv)}
.pill.ins{background:color-mix(in srgb,var(--ins) 16%,transparent);color:var(--ins)}
.kpi b{display:block;font:700 28px var(--display);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi span{font-size:13px;color:var(--muted)}
.kpi{background:var(--surface2);border-radius:10px;padding:14px 16px}
.note{background:var(--surface2);border-radius:9px;padding:10px 14px;font-size:14px;margin-top:12px}
.note.warn{background:color-mix(in srgb,var(--prot) 14%,transparent)}
.note.good{background:color-mix(in srgb,var(--ok) 13%,transparent)}
.note.bad{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.sub{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.sub button{border:1px solid var(--line)}
.mx td{text-align:center;padding:0}
.mx button{display:block;width:100%;border:0;padding:9px 6px;background:none;font:500 13px var(--mono);line-height:1.25;border-radius:0}
.mx button small{display:block;color:var(--muted);font-size:11px}
.fig{margin:16px 0 0;overflow-x:auto}
.fig svg{display:block;min-width:720px;width:100%;height:auto}
figcaption{font-size:13px;color:var(--muted);margin-top:8px;max-width:78ch}
svg text{fill:currentColor;font-family:var(--body)}
svg .t{font-weight:600;font-size:13px}svg .ts{font-size:11px;fill:var(--muted)}svg .lb{font-size:11px;fill:var(--muted)}
svg .nd{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
svg .nd.ac{stroke:var(--priv);stroke-width:2;fill:color-mix(in srgb,var(--priv) 10%,var(--surface))}
svg .ar{fill:none;stroke:var(--muted);stroke-width:1.5}
svg .ah{fill:var(--muted)}
svg .sq-bp{fill:var(--priv)}svg .sq-bi{fill:var(--ins)}
svg .sq-open{fill:var(--surface);stroke:var(--priv);stroke-width:1.5}
svg .sq-held{fill:url(#hatch);stroke:var(--prot);stroke-width:1.5}
svg .sq-hid{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:3 3;opacity:.7}
svg .chartline{fill:none;stroke:var(--priv);stroke-width:2.5}
svg .grid-l{stroke:var(--line);stroke-width:1}
svg .handle{fill:var(--surface);stroke:var(--priv);stroke-width:3;cursor:ns-resize;touch-action:none}
.chartbox svg{display:block;width:100%;height:auto;max-width:560px;min-width:0;touch-action:none}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.ptable input{width:64px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:14px}
.roles div{background:var(--surface2);border-radius:10px;padding:14px}
.roles h3{font-size:16px;margin-bottom:4px}
.roles ul{margin:6px 0 10px;padding-left:18px;font-size:14px}
.demo-tag{display:inline-block;font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:2px 7px}
.dcwrap{display:flex;align-items:flex-start;gap:8px;margin-top:14px}
.dcols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:12px;flex:1;min-width:0;overflow:auto;max-height:460px;padding:2px}
.dcol h4{margin:0 0 8px;font:700 14px var(--display);text-align:center;position:sticky;top:0;background:var(--surface);padding:4px 0;z-index:1}
.scard{display:block;width:100%;text-align:center;padding:8px 6px;margin-bottom:8px;border-radius:12px;border:2px solid var(--line);background:var(--surface);line-height:1.25}
.scard b{display:block;font:600 16px var(--mono)}.scard span{display:block;font-size:12px;color:var(--muted)}.scard small{font-size:12px;color:var(--muted)}
.scard.cov{border-color:var(--ok)}.scard.pay{border-color:var(--ins)}.scard.open{border-color:var(--priv)}
.scard.held{border-color:var(--prot);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--prot) 28%,transparent) 0 4px,transparent 4px 8px)}
.scard.sel{outline:3px solid var(--ink);outline-offset:1px}
.arrow{flex:none;align-self:center;width:40px;height:40px;border-radius:50%;border:0;background:color-mix(in srgb,var(--ins) 30%,var(--surface));font-size:22px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" style="fill:var(--surface)"/><line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--prot);stroke-width:3;opacity:.55"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker>
</defs></svg>

<div class="wrap" id="app"></div>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const BASE=new Date(2026,10,3);
const fmt=n=>{const d=new Date(BASE);d.setDate(d.getDate()+n);return d};
const dl=n=>fmt(n).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const dlong=n=>fmt(n).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
const isWork=n=>{const w=fmt(n).getDay();return w>0&&w<6};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const eur=n=>'€'+Math.round(n).toLocaleString('en-GB');

/* ---------- demo data ---------- */
const TIMES=['09:00','09:15','09:30','09:45','10:00','10:15','10:30','10:45','16:00','16:15','16:30','16:45','17:00','17:15'];
const W=[.2,.2,.25,.25,.45,.45,.55,.55,.8,.85,.9,.9,.85,.8]; // private demand weight: mornings are the valley, late afternoons are premium
const PF=70,IF=35; // illustrative average fees (private, insurer)
const DOCS=[
 {id:'d1',name:'Dr. Elena Pérez',spec:'Cardiology',agr:'Percentage, high on private',noshow:.08,privShare:.5},
 {id:'d2',name:'Dr. Marcos Gómez',spec:'Cardiology',agr:'Percentage, high on private',noshow:.06,privShare:.45},
 {id:'d3',name:'Dr. Lucía Romero',spec:'Dermatology',agr:'Fixed rent',noshow:.1,privShare:.4}];
const INS=[
 {id:'adeslas',name:'Adeslas',weekly:10,maxWait:10,ref:'Contract AD-2231',prov:false},
 {id:'dkv',name:'DKV',weekly:5,maxWait:7,ref:'Contract DKV-0917',prov:false},
 {id:'sanitas',name:'Sanitas',weekly:0,maxWait:14,ref:'',prov:true}];
const insName=id=>id==='private'?'Private':INS.find(i=>i.id===id).name;
const SIM={};
DOCS.forEach(d=>{SIM[d.id]={};for(let n=0;n<45;n++){if(!isWork(n))continue;const r=mul(hash(d.id+n));
 SIM[d.id][n]=TIMES.map((t,i)=>{const w=W[i];if(r()>.5+.4*w)return null;
  const priv=r()<Math.min(.85,d.privShare*(.5+w));const u=Math.max(r(),1e-6),x=r();
  let L=priv?Math.min(18,Math.floor(-Math.log(u)*4)):Math.min(40,3+Math.floor(-Math.log(u)*9));
  return{payer:priv?'private':(x<.5?'adeslas':x<.8?'dkv':'sanitas'),bookedDay:n-L}})}});

const STD={first:[{d:0,p:0},{d:1,p:5},{d:3,p:15},{d:7,p:35},{d:14,p:60}],rev:[{d:0,p:0},{d:1,p:0},{d:3,p:5},{d:7,p:15},{d:14,p:30}]};
const PRESETS={
 short:{label:'Short curve (protection only up to 3 days)',first:[{d:0,p:0},{d:1,p:5},{d:3,p:15},{d:4,p:0},{d:14,p:0}],rev:[{d:0,p:0},{d:1,p:0},{d:3,p:5},{d:4,p:0},{d:14,p:0}]},
 zero:{label:'Zero protection',first:[{d:0,p:0},{d:14,p:0}],rev:[{d:0,p:0},{d:14,p:0}]},
 total:{label:'Total protection until 2 days before',first:[{d:0,p:0},{d:1,p:0},{d:2,p:100},{d:14,p:100}],rev:[{d:0,p:0},{d:1,p:0},{d:2,p:100},{d:14,p:100}]}};

const S={role:'how',today:0,horizon:30,
 clinic:{v:1,curves:clone(STD)},
 exc:{d2:{v:1,kind:'zero',curves:{first:clone(PRESETS.zero.first),rev:clone(PRESETS.zero.rev)},by:'Dr. Gómez (opt-out, approved by manager)',at:-12},
      d3:{v:1,kind:'short',curves:{first:clone(PRESETS.short.first),rev:clone(PRESETS.short.rev)},by:'Fixed-rent agreement rule',at:-30}},
 ov:[{id:1,doc:'d1',day:8,type:'block',reason:'Private cardiology check-up campaign',author:'Manager',at:-2}],
 req:[{id:1,doc:'d1',kind:'total',status:'pending',at:0}],
 ub:{},ev:[],
 log:[{at:-30,who:'Manager',text:'Clinic default curve v1 activated.'},{at:-12,who:'Manager',text:'Approved opt-out for Dr. Marcos Gómez: zero protection.'}],
 pat:{payer:'adeslas',act:'first',spec:'Cardiology',off:0,sel:null,msg:null},heldMode:'hide',
 mg:{tab:'overview',scope:'clinic',draft:null,act:'first'},
 aud:{doc:'d1',day:2,act:'first'},ovForm:{doc:'d1',day:3,type:'open',reason:''},
 dv:{doc:'d1',day:null,act:'first'},
 rc:{filter:'all',off:0,sel:null,payer:'adeslas',reason:'Recurring patient',act:'first',msg:null},
 lastTouched:null};

/* ---------- protection engine ---------- */
function interp(p,D){const a=[...p].sort((x,y)=>x.d-y.d);if(D<=a[0].d)return a[0].p;const L=a[a.length-1];if(D>=L.d)return L.p;
 for(let i=1;i<a.length;i++)if(D<=a[i].d){const x=a[i-1],y=a[i];return x.p+(y.p-x.p)*(D-x.d)/(y.d-x.d)}return L.p}
function curveSrc(docId,act){const e=S.exc[docId];
 if(e)return{pts:e.curves[act],label:'Doctor exception v'+e.v+' ('+kindName(e.kind)+')',ex:true};
 return{pts:S.clinic.curves[act],label:'Clinic default v'+S.clinic.v,ex:false}}
const kindName=k=>({zero:'zero protection',short:'short curve',total:'total protection',custom:'custom curve'}[k]||k);
function stat(dId,day,i){const ub=S.ub[dId+'|'+day+'|'+i];if(ub)return{payer:ub.payer,forced:ub.forced,user:true};
 const s=SIM[dId][day]&&SIM[dId][day][i];return s&&s.bookedDay<=S.today?{payer:s.payer}:null}
function computeDay(doc,day,act,ptsIn){
 const D=day-S.today,src=curveSrc(doc.id,act),pts=ptsIn||src.pts;
 const slots=TIMES.map((t,i)=>({i,time:t,w:W[i],st:stat(doc.id,day,i),vis:{},rel:{}}));
 const free=slots.filter(s=>!s.st),pb=slots.filter(s=>s.st&&s.st.payer==='private').length;
 const pct=D>S.horizon?0:interp(pts,D),exp=pct/100*14;
 let prot=Math.min(free.length,Math.round(Math.max(0,exp*(1-doc.noshow)-pb)));
 const ov=S.ov.find(o=>o.doc===doc.id&&o.day===day),when=D===0?'today':D+' days ahead';
 let why;
 if(ov&&ov.type==='open'){prot=0;why='Manual: opened to insurers by '+ov.author+'. Reason: '+ov.reason+'.'}
 else if(ov&&ov.type==='block'){prot=free.length;why='Manual: blocked for private by '+ov.author+'. Reason: '+ov.reason+'.'}
 else if(D>S.horizon)why='Beyond the '+S.horizon+'-day protection horizon, so nothing is held.';
 else why=when+': curve '+Math.round(pct)+'% of 14 slots = '+exp.toFixed(1)+' expected private, × '+(1-doc.noshow).toFixed(2)+' attendance, minus '+pb+' already booked private = '+prot+' held of '+free.length+' free.';
 const order=[...free].sort((a,b)=>b.w-a.w||b.i-a.i);order.slice(0,prot).forEach(s=>s.prot=true);
 const res={};
 INS.forEach(ins=>{const fl=Math.ceil(ins.weekly/5);const vis=free.filter(s=>!s.prot);let rel=0;
  if(vis.length<fl){const c=free.filter(s=>s.prot).sort((a,b)=>a.w-b.w||a.i-b.i);while(vis.length<fl&&c.length){const s=c.shift();vis.push(s);s.rel[ins.id]=true;rel++}}
  vis.forEach(s=>s.vis[ins.id]=true);res[ins.id]={n:vis.length,rel}});
 return{D,pct,exp,pb,prot,free:free.length,slots,why,src,ov,ins:res,doc}}
const workdays=(n,from)=>{const a=[];for(let d=from==null?S.today:from;a.length<n&&d<45;d++)if(isWork(d))a.push(d);return a};
const nextWork=()=>{for(let d=S.today+1;d<45;d++)if(isWork(d))return d};
function book(docId,day,i,payer,o){const k=docId+'|'+day+'|'+i;S.ub[k]={payer,forced:!!o.forced,reason:o.reason||'',by:o.channel};
 S.ev.unshift({at:S.today,doc:docId,day,time:TIMES[i],payer,channel:o.channel,forced:!!o.forced,reason:o.reason||''})}
function estCost(docId,kind){const doc=DOCS.find(d=>d.id===docId),days=workdays(20);let a=0,b=0;
 const alt=PRESETS[kind].first;days.forEach(day=>{a+=computeDay(doc,day,'first',S.clinic.curves.first).prot;b+=computeDay(doc,day,'first',alt).prot});
 return kind==='zero'?{t:'private revenue at risk',v:a*.5*(PF-IF)}:{t:'insurer revenue forgone',v:Math.max(0,b-a)*.5*IF}}

/* ---------- ui helpers ---------- */

   +'<button class="btn pri" data-a="rcBook">'+(held&&c.payer!=='private'?'Force booking':'Book')+'</button></div></div>'}}
 h+='</section>';
 h+='<section class="card"><h3>Recent bookings</h3>'+(S.ev.length?'<div class="scroll"><table><thead><tr><th>Slot</th><th>Payer</th><th>Channel</th></tr></thead><tbody>'+S.ev.slice(0,6).map(e=>'<tr><td>'+esc(DOCS.find(d=>d.id===e.doc).name)+' · '+dl(e.day)+' '+e.time+'</td><td>'+insName(e.payer)+'</td><td>'+e.channel+(e.forced?' <span class="pill warn">forced: '+esc(e.reason)+'</span>':'')+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted">Nothing booked yet in this demo.</p>')+'</section>';return h}
A.rcDoc=(d,t,v)=>{S.rc.filter=v;S.rc.sel=null};A.rcAct=(d,t,v)=>{S.rc.act=v;S.rc.sel=null};A.rcPg=d=>{S.rc.off=Math.max(0,Math.min(18,S.rc.off+3*+d.d))};
A.rcCard=d=>{S.rc.sel=d.key;S.rc.msg=null};A.rcPayer=(d,t,v)=>{S.rc.payer=v};A.rcReason=(d,t,v)=>{S.rc.reason=v};
A.rcBook=()=>{const c=S.rc,[di,dy,i]=c.sel.split('|'),doc=DOCS.find(x=>x.id===di),day=+dy,sl=computeDay(doc,day,c.act).slots[+i];if(sl.st){c.sel=null;return}
 const forced=!!sl.prot&&c.payer!=='private';book(doc.id,day,+i,c.payer,{channel:'Reception',forced,reason:forced?c.reason:''});
 c.msg='Booked '+TIMES[+i]+' with '+doc.name+', '+dl(day)+', for '+insName(c.payer)+(forced?' (forced, reason: '+c.reason+')':'')+'.';c.sel=null};

/* ---------- shell ---------- */
A.role=d=>{S.role=d.r};
A.day=d=>{const s=+d.d;let n=S.today+s;while(n>=0&&n<=20&&!isWork(n))n+=s;if(n>=0&&n<=20){S.today=n;S.pat.sel=null;S.rc.sel=null;S.dv.day=null;S.mg.draft=null}};
function render(){
 const roles=[['patient','Patient'],['manager','Manager'],['doctor','Doctor'],['reception','Reception']];
 const view={how:vHow,patient:vPatient,manager:vManager,doctor:vDoctor,reception:vReception}[S.role]();
 document.getElementById('app').innerHTML='<header class="top"><div class="brand"><span class="mark"></span><div><b>Slot Visibility</b><small>Dynamic availability by payer · demo with illustrative data</small></div></div>'
 +'<div class="clock" title="Move the demo date to see protection release as the day gets closer">Demo date <button data-a="day" data-d="-1" aria-label="Previous working day">‹</button><b>'+dl(S.today)+'</b><button data-a="day" data-d="1" aria-label="Next working day">›</button></div></header>'
 +'<nav class="tabs"><div class="seg"><button class="'+(S.role==='how'?'on':'')+'" data-a="role" data-r="how">How it works</button></div><span class="lbl">View as</span><div class="seg">'+roles.map(r=>'<button class="'+(S.role===r[0]?'on':'')+'" data-a="role" data-r="'+r[0]+'">'+r[1]+'</button>').join('')+'</div></nav>'+view}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=A[t.dataset.a];if(f){f(t.dataset,t);render()}});
document.addEventListener('change',e=>{const t=e.target.closest('[data-c]');if(!t)return;const f=A[t.dataset.c];if(f){f(t.dataset,t,t.value);render()}});
document.addEventListener('input',e=>{if(e.target.id==='lv-reason'){S.ovForm.reason=e.target.value;const b=document.querySelector('[data-a="lvApply"]');if(b)b.disabled=!e.target.value.trim()}});
render();
})();
</script>

</body>
